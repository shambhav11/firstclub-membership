services:
  postgres:
    image: postgres:17-alpine
    container_name: firstclub-membership-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-membership}
      POSTGRES_USER: ${POSTGRES_USER:-membership}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-membership}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - membership-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: firstclub-membership-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  membership-postgres-data:
